# API Cluster Load Balancer & Reverse Proxy — docs/02 §8, docs/08 §3, docs/10 §10

server {
    listen 80;
    listen [::]:80;
    server_name api.* 127.0.0.1 localhost;

    # ---- Liveness & Readiness Probes (docs/10 §10.4) ----
    # Dedicated probe endpoints bypass rate-limiting for container orchestrators & load balancers
    location = /health {
        proxy_pass http://api_cluster/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location = /ready {
        proxy_pass http://api_cluster/ready;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # ---- Real-Time Server-Sent Events (SSE) Stream (docs/02 §8, Module 5) ----
    # Long-lived, non-buffered streaming connection for real-time notification toasts
    location /api/v1/notifications/stream {
        proxy_pass http://api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Critical: disable proxy buffering and caching to push chunks instantly
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Extended timeouts for persistent stream (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- High-Resolution Media & Snag Photo Uploads (docs/09 §3.11) ----
    # Raised 25MB ceiling for architectural CAD drawings, inspection photos & veneers
    location ~ ^/api/v1/(media/upload|design-projects/[^/]+/inspections/photos) {
        client_max_body_size 25m;
        client_body_timeout 60s;
        proxy_read_timeout 60s;

        limit_req zone=nfi_general_limit burst=30 nodelay;
        proxy_pass http://api_cluster;
    }

    # ---- Sensitive Authentication Rate-Limiting (docs/09 §4.4) ----
    # Strict 5 req/s zone with 10 burst to mitigate brute-force and credential stuffing
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|mfa/verify) {
        limit_req zone=nfi_auth_limit burst=10 nodelay;
        proxy_pass http://api_cluster;
    }

    # ---- General API Endpoints ----
    location / {
        limit_req zone=nfi_general_limit burst=50 nodelay;
        proxy_pass http://api_cluster;
    }

    # ---- Standardized Luxury Gateway Error Envelopes ----
    error_page 502 503 504 /50x.json;
    location = /50x.json {
        root /usr/share/nginx/html/errors;
        internal;
        default_type application/json;
    }
}
