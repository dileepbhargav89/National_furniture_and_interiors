# Admin Command Portal Reverse Proxy — docs/02 §8, docs/09 §4.10

server {
    listen 80;
    listen [::]:80;
    server_name admin.nationalinteriors.in admin.local;

    # ---- Security Headers for Admin Command Centre ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: ws: wss:; frame-ancestors 'none';" always;

    # ---- Next.js Static Chunks ----
    location /_next/static/ {
        proxy_pass http://admin_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- Dynamic Admin Portal Routes ----
    location / {
        limit_req zone=nfi_general_limit burst=50 nodelay;
        proxy_pass http://admin_cluster;
    }

    # ---- Luxury Branded Error Fallback ----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/errors;
        internal;
    }
}
