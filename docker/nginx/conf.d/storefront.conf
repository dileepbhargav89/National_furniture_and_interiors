# Storefront Load Balancer & Edge Caching — docs/02 §8, docs/10 §9.9

server {
    listen 80;
    listen [::]:80;
    server_name nationalinteriors.in www.nationalinteriors.in storefront.local;

    # ---- Next.js Immutable Static Chunk Caching (docs/10 §9.9) ----
    location /_next/static/ {
        proxy_pass http://storefront_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- Next.js Optimized Image Route ----
    location /_next/image {
        proxy_pass http://storefront_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # ---- Favicons & Static Public Assets ----
    location ~* \.(ico|png|jpg|jpeg|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://storefront_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ---- Dynamic Pages & ISR HTML Routes ----
    location / {
        limit_req zone=nfi_general_limit burst=60 nodelay;
        proxy_pass http://storefront_cluster;
    }

    # ---- Luxury Branded Error Fallback ----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/errors;
        internal;
    }
}
