# Upstream Service Pools — docs/02 §8.1, docs/10 §10.2
# High-concurrency least_conn load balancing with HTTP/1.1 keepalive pooling

upstream api_cluster {
    least_conn;
    server api-1:4000 max_fails=3 fail_timeout=10s;
    server api-2:4000 max_fails=3 fail_timeout=10s;
    
    # Keepalive connection pool (docs/10 §10.2) reduces TCP/TLS handshake latency
    keepalive 64;
}

upstream storefront_cluster {
    server storefront:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream admin_cluster {
    server admin:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
