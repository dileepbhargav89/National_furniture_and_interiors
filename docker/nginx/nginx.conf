# Production Nginx Configuration — docs/02 §8, docs/06 §7.1, docs/10 §9, §10.2
# High-concurrency reverse proxy & load balancer for National Furniture & Interiors

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- Security: Server Tokens & Version Disclosure (docs/09 §5.5) ----
    server_tokens off;

    # ---- Correlation & Request Tracing (docs/08 §3.1, docs/14 §3.1) ----
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ---- Structured JSON Access Logging (docs/14 §3.2) ----
    log_format nfi_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_id":"$req_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log nfi_json;
    error_log /var/log/nginx/error.log warn;

    # ---- Performance & Socket Tuning (docs/10 §10.2) ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ---- Buffer Sizing & Slowloris Defense (docs/09 §4.4) ----
    client_body_buffer_size 128k;
    client_max_body_size 2m; # Overridden to 25m on media/photo endpoints
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ---- Gzip Compression (docs/08 §5.2, threshold > 1KB) ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- Rate Limiting Zones (docs/02 §4, §16, docs/09 §4.4) ----
    # 50 requests/sec for general endpoints, 5 requests/sec for sensitive auth
    limit_req_zone $binary_remote_addr zone=nfi_general_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=nfi_auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # ---- Modular Virtual Hosts & Upstreams ----
    include /etc/nginx/conf.d/*.conf;
}
