# Local development topology — docs/06_project_structure.md §7.1, docs/02_enterprise_architecture.md §8.1
# (container inventory), docs/10_devops_architecture.md §3 (Local environment), §4 (Container Strategy).
# nginx is intentionally not included here — docs/10 §3 scopes it to Staging/Production ingress; Local
# talks to each service's port directly.
name: nfi-local

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/apps/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/nfi_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/apps/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/nfi_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    build:
      context: ..
      dockerfile: docker/apps/Dockerfile.storefront
    restart: unless-stopped
    env_file:
      - ../apps/storefront/.env.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

  admin:
    build:
      context: ..
      dockerfile: docker/apps/Dockerfile.admin
    restart: unless-stopped
    env_file:
      - ../apps/admin/.env.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - '3001:3001'
    depends_on:
      - api

volumes:
  mongodb_data:
  redis_data:
