# Local development topology — docs/06_project_structure.md §7.1, docs/02_enterprise_architecture.md §8.1
# (container inventory), docs/10_devops_architecture.md §3 (Local environment), §4 (Container Strategy).
# nginx is intentionally not included here — docs/10 §3 scopes it to Staging/Production ingress; Local
# talks to each service's port directly.
name: nfi-local

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host-side 6380, not 6379: this machine already runs a native Redis-compatible service
      # (Memurai) on 6379. Container-to-container traffic (api/worker below) is unaffected —
      # it uses the `redis:6379` service hostname over the compose network, never this host port.
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/apps/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/nfi_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/apps/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/nfi_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    build:
      context: ..
      dockerfile: docker/apps/Dockerfile.storefront
    restart: unless-stopped
    env_file:
      - ../apps/storefront/.env.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      api:
        # Gates on the api container's HEALTHCHECK, which probes /ready (docker/apps/Dockerfile.api)
        # — "api can actually serve traffic", not merely "api's process started".
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: docker/apps/Dockerfile.admin
    restart: unless-stopped
    env_file:
      - ../apps/admin/.env.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      # The standalone server.js Next.js generates reads PORT directly — it does not honor the
      # `-p 3001` in package.json's dev/start scripts (those only apply to the `next` CLI).
      PORT: '3001'
    ports:
      - '3001:3001'
    depends_on:
      api:
        # Gates on the api container's HEALTHCHECK, which probes /ready (docker/apps/Dockerfile.api)
        # — "api can actually serve traffic", not merely "api's process started".
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
