# CodeRabbit AI Code Review Workflow
# Spec: Comprehensive AI-powered pull request reviews for National Furniture & Interiors
name: CodeRabbit AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: coderabbit-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@coderabbitai'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: CodeRabbit AI PR Reviewer
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          debug: false
